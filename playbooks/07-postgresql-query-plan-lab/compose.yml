services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: query_plan_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "55434:5432"
    volumes:
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
