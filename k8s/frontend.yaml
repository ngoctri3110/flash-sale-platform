apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: flash-sale }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: flash-sale-frontend:local
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: flash-sale }
spec: { type: NodePort, selector: { app: frontend }, ports: [{ port: 80, targetPort: 80 }] }
