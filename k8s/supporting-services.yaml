apiVersion: v1
kind: Secret
metadata: { name: postgres, namespace: flash-sale }
type: Opaque
stringData: { POSTGRES_PASSWORD: flashsale }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: flash-sale }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - { name: POSTGRES_DB, value: flashsale }
            - { name: POSTGRES_USER, value: flashsale }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "flashsale", "-d", "flashsale"] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: flash-sale }
spec: { selector: { app: postgres }, ports: [{ port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: flash-sale }
spec:
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: apache/kafka-native:4.0.0
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: broker,controller }
            - { name: KAFKA_LISTENERS, value: PLAINTEXT://:9092,CONTROLLER://:9093 }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: PLAINTEXT://kafka:9092 }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@kafka:9093 }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
          ports: [{ containerPort: 9092 }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: flash-sale }
spec: { selector: { app: kafka }, ports: [{ port: 9092, targetPort: 9092 }] }
