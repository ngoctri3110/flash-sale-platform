apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: flash-sale }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: flash-sale-backend:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: local }
            - { name: DB_URL, value: jdbc:postgresql://postgres:5432/flashsale }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: kafka:9092 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: flash-sale }
spec: { selector: { app: backend }, ports: [{ port: 8080, targetPort: 8080 }] }
