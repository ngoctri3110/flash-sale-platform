spring:
  application:
    name: flash-sale-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

app:
  outbox:
    publisher:
      enabled: false
      batch-size: 50
      retry-delay: 5s
      lease-duration: 30s
